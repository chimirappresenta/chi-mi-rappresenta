name: Aggiorna dati

on:
  schedule:
    - cron: "0 5 * * 1" # ogni lunedì alle 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write # per la segnalazione "Leggi regionali da riassumere"

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      # gli avvisi della settimana scorsa, per segnalare su Telegram solo quelli nuovi
      - run: git show HEAD:src/data/meta.json > "$RUNNER_TEMP/meta-prima.json" || echo "{}" > "$RUNNER_TEMP/meta-prima.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Risultati elettorali già estratti: sono storici, li teniamo in cache tra un'esecuzione e l'altra.
      - uses: actions/cache@v4
        with:
          path: data/raw/elezioni-*.json
          key: elezioni-v1
      - run: npm run data:refresh
      # Riassunti delle nuove leggi: solo se nei secrets del repository c'è ANTHROPIC_API_KEY.
      - name: Riassunti delle leggi
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm run riassunti && npm run data
      - run: npm run build
      # Leggi nuove senza spiegazione: una segnalazione su GitHub (se non ce n'è già una aperta), così arriva un'email.
      - name: Avviso leggi da riassumere
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const m=require('./src/data/meta.json'); const l=m.leggiSenzaRiassunto||[]; require('fs').writeFileSync('leggi-da-riassumere.md', l.map(x=>'- ['+x.intestazione+']('+x.url+')'+(x.oggetto?': '+x.oggetto:'')).join(String.fromCharCode(10)))"
          if [ -s leggi-da-riassumere.md ]; then
            TITOLO="Leggi regionali da riassumere"
            APERTE=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number --jq 'length')
            if [ "$APERTE" = "0" ]; then
              { echo "Ci sono leggi regionali nuove senza spiegazione in parole semplici:"; echo; cat leggi-da-riassumere.md; echo; echo "Scrivere i riassunti in data/manual/riassunti-leggi.json (vedi il README), poi chiudere questa segnalazione."; } > corpo.md
              gh issue create --title "$TITOLO" --body-file corpo.md
            fi
          fi
          rm -f leggi-da-riassumere.md corpo.md
      - name: Commit dei dati aggiornati
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A src/data data/manual public/comuni-index.json
          if git diff --cached --quiet; then
            echo "cambiati=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aggiornamento dati $(date -u +%Y-%m-%d)"
            git push
            echo "cambiati=si" >> "$GITHUB_OUTPUT"
          fi
      # Avvisi su Telegram: com'è andata, leggi da riassumere e avvisi nuovi; oppure l'errore.
      - name: Avviso Telegram
        if: success()
        run: node scripts/avviso-telegram.mjs aggiornamento-ok "$RUNNER_TEMP/meta-prima.json" "${{ steps.commit.outputs.cambiati }}"
      - name: Avviso Telegram (errore)
        if: failure()
        run: node scripts/avviso-telegram.mjs aggiornamento-errore
